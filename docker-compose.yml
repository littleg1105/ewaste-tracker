version: '3.8'

services:
  # Smart Contract Development Environment
  hardhat:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8545:8545"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npx hardhat node

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - hardhat
    environment:
      - REACT_APP_HARDHAT_NETWORK=localhost
      - REACT_APP_HARDHAT_PORT=8545
    volumes:
      - ./frontend:/app
      - /app/node_modules
