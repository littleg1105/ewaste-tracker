version: '3.8'

services:
  ganache:
    image: trufflesuite/ganache:latest
    ports:
      - "8545:8545"
    command: --deterministic --networkId 5777 --chain.vmErrorsOnRPCResponse true --server.host 0.0.0.0 --miner.blockTime 0

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - ganache
    environment:
      - REACT_APP_GANACHE_URL=http://ganache:8545
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
