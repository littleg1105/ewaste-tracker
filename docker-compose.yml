services:
  # Smart Contract Development Environment
  hardhat:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8545:8545"
    volumes:
      - ./:/app:delegated
      - /app/node_modules
      - /app/scripts
    environment:
      - NODE_ENV=development
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8545"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    command: ["node-and-deploy"]

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      hardhat:
        condition: service_healthy
    environment:
      - REACT_APP_HARDHAT_NETWORK=localhost
      - REACT_APP_HARDHAT_PORT=8545
    volumes:
      - ./frontend:/app:delegated
      - type: bind
        source: ./frontend/src/contractAddresses.json
        target: /usr/share/nginx/html/contractAddresses.json
        consistency: cached
      - type: bind
        source: ./frontend/src/deployment-timestamp.js
        target: /usr/share/nginx/html/deployment-timestamp.js
        consistency: cached

  # Utility container to run commands against the hardhat node
  deployer:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/app:delegated
      - /app/node_modules
      - /app/scripts
    depends_on:
      hardhat:
        condition: service_healthy
    environment:
      - NODE_ENV=development
    command: ["deploy-contracts"]
    profiles:
      - deploy # Only run when explicitly asked
